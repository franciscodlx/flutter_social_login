name: flutter_social_login_workspace
description: Social login plugins for Flutter on a shared core (system browser, OAuth 2.0 + PKCE).
publish_to: none

environment:
  sdk: ^3.14.0

workspace:
  - packages/social_auth_core
  - packages/social_auth_core/example
  - packages/social_auth_core_platform_interface
  - packages/social_auth_core_android
  - packages/social_auth_core_ios
  - packages/social_auth_linkedin
  - packages/social_auth_linkedin/example
  - packages/social_auth_x
  - packages/social_auth_x/example
  - packages/social_auth_mercadolibre
  - packages/social_auth_mercadolibre/example
  - packages/social_auth_twitch
  - packages/social_auth_twitch/example
  - packages/social_auth_presets
  - packages/social_auth_presets/example
  - packages/social_auth_telegram
  - packages/social_auth_telegram/example
  - packages/social_auth_tiktok
  - packages/social_auth_tiktok/example
  - packages/social_auth_entra_native
  - packages/social_auth_entra_native/example

dev_dependencies:
  melos: ^7.0.0

melos:
  scripts:
    analyze:
      run: dart analyze --fatal-infos .
      description: Static analysis of every package.
    test:
      run: dart run melos exec --dir-exists=test -- flutter test
      description: Unit tests of every package.
    format:
      run: dart format --set-exit-if-changed .
