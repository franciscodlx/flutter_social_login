name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: dart analyze --fatal-infos .
      - name: Unit tests
        run: |
          for package in packages/*; do
            if [ -d "$package/test" ]; then (cd "$package" && flutter test); fi
          done
      - name: Example widget tests
        run: |
          for example in packages/*/example; do
            if [ -d "$example/test" ]; then (cd "$example" && flutter test); fi
          done
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Local servers (mock provider and example backends)
        run: |
          for tool in tools/*; do
            (cd "$tool" && node --test)
          done

  android:
    name: Example ${{ matrix.example }} (Android)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [social_auth_core, social_auth_linkedin]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
        working-directory: packages/${{ matrix.example }}/example

  ios:
    name: Example ${{ matrix.example }} (iOS)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        example: [social_auth_core, social_auth_linkedin]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
        working-directory: packages/${{ matrix.example }}/example
