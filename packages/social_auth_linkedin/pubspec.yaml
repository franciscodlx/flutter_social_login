name: social_auth_linkedin
description: Sign In with LinkedIn (OpenID Connect) for Flutter in the system browser, without a WebView and without the client secret in the app.
version: 0.1.1
repository: https://github.com/franciscodlx/flutter_social_login
issue_tracker: https://github.com/franciscodlx/flutter_social_login/issues
topics: [linkedin, oauth, openid-connect, login, authentication]
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  social_auth_core: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
